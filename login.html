<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="signup-box">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue to your dashboard
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <p id="loginError"></p>


                <button
                    type="submit"
                    class="signup-btn">

                    Login

                </button>

            </form>


            <p class="login-text">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
